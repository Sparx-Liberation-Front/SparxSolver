name: Build & Release Installers

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Installer on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            output_name: sparxsolver-installer-linux
          - os: windows-latest
            output_name: sparxsolver-installer-windows.exe
          - os: macos-latest
            output_name: sparxsolver-installer-macos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Node Dependencies & Build Bundles
        run: |
          npm install
          npm run build:all

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller customtkinter pillow

      - name: Run Build Executable Script
        run: |
          python build-installer-exe.py

      - name: Rename installer
        shell: bash
        run: |
          source_file=$(find installer/dist -maxdepth 1 -type f -name 'SparxSolver-Installer*' | head -n 1)
          test -n "$source_file"
          cp "$source_file" "${{ matrix.output_name }}"

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output_name }}
          path: ${{ matrix.output_name }}
          if-no-files-found: error
