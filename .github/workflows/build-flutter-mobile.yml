name: Build Flutter Mobile Apps

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Verify app compiles and tests pass
        run: |
          flutter analyze
          flutter test

      - name: Build Android release APK
        run: flutter build apk --release

      - name: Rename Android artifact
        run: mv build/app/outputs/flutter-apk/app-release.apk sparxsolver-installer-android.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: sparxsolver-installer-android.apk
          path: mobile_app/sparxsolver-installer-android.apk
          if-no-files-found: error

  build-ios:
    name: Build iOS App
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Verify app compiles and tests pass
        run: |
          flutter analyze
          flutter test

      - name: Build iOS release IPA (unsigned)
        run: flutter build ipa --release --no-codesign

      - name: Rename iOS artifact
        run: |
          ipa_path=$(find build/ios/ipa -maxdepth 1 -type f -name '*.ipa' | head -n 1)
          test -n "$ipa_path"
          cp "$ipa_path" sparxsolver-ios-ci-unsigned.ipa

      - name: Upload iOS build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sparxsolver-ios-ci-unsigned.ipa
          path: mobile_app/sparxsolver-ios-ci-unsigned.ipa
          if-no-files-found: error
