<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="sidepanel.css">
    <link rel="stylesheet" href="katex/katex.min.css">
    <script src="katex/katex.min.js"></script>
    <script src="katex/auto-render.min.js"></script>
    <style>
        .censored { -webkit-text-security: disc; }
        #statusIndicator { font-size: 13px; font-weight: bold; margin-bottom: 10px; padding: 8px; border-radius: 4px; }
        .status-info { background: #e5e7eb; color: #374151; }
        .status-action { background: #d1fae5; color: #065f46; }
        .status-warn { background: #fef3c7; color: #92400e; }
    </style>
</head>

<body>

<div class="header">
    <img src="logo.png">
    <div>
        <h1>Sparx Solver</h1>
        <p>Assistant dashboard</p>
    </div>
</div>

<section class="card">
    <div id="statusIndicator" class="status-info">Status: Idle</div>
    
    <details class="settings-menu" open>
        <summary>AI Settings</summary>
        <label class="field-label" for="apiKeys">Gemini API keys</label>
        <textarea id="apiKeys" class="censored" placeholder="One Gemini API key per line" rows="3"></textarea>
        <label class="checkbox-label">
            <input type="checkbox" id="toggleKeys"> Show API keys
        </label>

        <div class="settings-grid">
            <label>Minimum thinking delay (seconds)<input id="minDelaySeconds" type="number" min="0" max="120" step="1"></label>
            <label>Maximum thinking delay (seconds)<input id="maxDelaySeconds" type="number" min="0" max="300" step="1"></label>
            <label>Gemini request timeout (seconds)<input id="requestTimeoutSeconds" type="number" min="10" max="300" step="1"></label>
            <label>Wait between retries (seconds)<input id="retryDelaySeconds" type="number" min="0" max="60" step="1"></label>
            <label>Maximum request attempts<input id="maxRequestAttempts" type="number" min="1" max="10" step="1"></label>
        </div>
        <p class="settings-help">Requests stop retrying after the limits above. Lower the timeout and attempts if Gemini is hanging.</p>
        <button id="saveSettings">Save AI Settings</button>
        <span id="settingsSaved" class="settings-saved" aria-live="polite"></span>
    </details>
</section>


<section class="card">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <h2 style="margin: 0;">Bookwork</h2>
        <div class="bookwork-actions">
            <button id="exportMarkdown" class="secondary-button" title="Download bookwork as Markdown">MD</button>
            <button id="exportHtml" class="secondary-button" title="Download bookwork as HTML">HTML</button>
            <button id="clearAllBw" class="danger-button">Clear All</button>
        </div>
    </div>

    <div id="bookwork">
        No bookwork detected yet.
    </div>
</section>


<button class="start" id="start">
    Start Automation
</button>


<script src="sidepanel.js"></script>

</body>
</html>
